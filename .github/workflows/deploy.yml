name: Deploy Radio a GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Actualizando Radio
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        script: |
            source ~/.bashrc
            cd /home/hernandezdiazjm00/radio
            git pull origin main
            npm install
            npx pm2 restart marina-radio
